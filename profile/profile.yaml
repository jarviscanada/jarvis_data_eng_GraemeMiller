# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Automates the management of system usage data for a Linux server cluster in the Jarvis Linux Cluster Administration (LCA) team using Docker, PostgreSQL, and bash scripts. This project simplifies database operations, enables the creation of tables to store hardware specifications and usage data, and utilizes crontab for automated data collection. Technologies used include Docker, PostgreSQL, and bash scripting for database setup and maintenance.
  - name: "Core Java Grep App"
    git_url: "/core_java"
    description: The goal of this project is to create a Java application that reads through files in a specified directory and prints out lines of text matching a given regular expression (Regex) pattern. The application utilizes Maven for dependency management and packaging, and my development was done using the IntelliJ IDEA IDE. The application consists of several Java classes designed to traverse directories, read files, and log lines of text that match the specified Regex pattern. The code employs modern Java features such as lambda expressions, streams, and ArrayLists to efficiently process the data. Finally, the project is containerized using Docker to enable easy distribution and deployment.
  - name: "Springboot App"
    git_url: "/springboot"
    description: ""

